name: techa

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: techa_db
      POSTGRES_USER: techa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U techa_user -d techa_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    image: techa-api:ndvi-20261011
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file: ../.env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      PORT: "8000"
      ENABLE_PIPELINE: "false"
      DATABASE_URL: postgresql+asyncpg://techa_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/techa_db
      DATABASE_URL_SYNC: postgresql://techa_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/techa_db
      TILES_STORAGE_PATH: /data/tiles
      RASTER_STORAGE_PATH: /data/rasters
    ports:
      - 127.0.0.1:18010:8000
    volumes:
      - api_data:/data
    networks: [private]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5)); assert d.get('database') == 'connected'"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging: *logging

networks:
  private:

volumes:
  postgres_data:
  api_data:
